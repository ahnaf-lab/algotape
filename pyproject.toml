[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "algotape"
version = "0.1.0"
description = "A terminal TUI that records how classic algorithms think, step by step, onto a cassette you can play, pause, and rewind."
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
include = ["algotape*"]
